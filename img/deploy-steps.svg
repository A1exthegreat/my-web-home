<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="da" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0L9 4L0 8z" fill="#1a6fb5"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="14" fill="#f7fafd" stroke="#e3e8ef"/>
  <text x="460" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0a2540">从一个文件夹到一个可访问的网址：五步</text>

  <g font-size="14.5">
    <g>
      <rect x="22" y="80" width="152" height="66" rx="12" fill="#0a2540"/>
      <text x="98" y="108" text-anchor="middle" fill="#fff">① 手写页面</text>
      <text x="98" y="130" text-anchor="middle" fill="#9fd6e6" font-size="12">HTML + 一个 style.css</text>
    </g>
    <g>
      <rect x="204" y="80" width="152" height="66" rx="12" fill="#103a63"/>
      <text x="280" y="108" text-anchor="middle" fill="#fff">② git commit</text>
      <text x="280" y="130" text-anchor="middle" fill="#9fd6e6" font-size="12">本地版本快照</text>
    </g>
    <g>
      <rect x="386" y="80" width="152" height="66" rx="12" fill="#1a6fb5"/>
      <text x="462" y="108" text-anchor="middle" fill="#fff">③ git push</text>
      <text x="462" y="130" text-anchor="middle" fill="#dff6f8" font-size="12">上传到 GitHub 仓库</text>
    </g>
    <g>
      <rect x="568" y="80" width="152" height="66" rx="12" fill="#14a0ad"/>
      <text x="644" y="108" text-anchor="middle" fill="#fff">④ 开启 Pages</text>
      <text x="644" y="130" text-anchor="middle" fill="#e6fbfc" font-size="12">deployments / pages build</text>
    </g>
    <g>
      <rect x="750" y="80" width="150" height="66" rx="12" fill="#f4b942"/>
      <text x="825" y="108" text-anchor="middle" fill="#3d2c00">⑤ 访问 &amp; 验证</text>
      <text x="825" y="130" text-anchor="middle" fill="#5c4400" font-size="12">curl -Iv 看协议版本</text>
    </g>
  </g>
  <g stroke="#1a6fb5" stroke-width="2.4" marker-end="url(#da)">
    <line x1="174" y1="113" x2="198" y2="113"/>
    <line x1="356" y1="113" x2="380" y2="113"/>
    <line x1="538" y1="113" x2="562" y2="113"/>
    <line x1="720" y1="113" x2="744" y2="113"/>
  </g>

  <g font-size="13" fill="#52606d">
    <text x="22" y="184">检查点 1：<tspan fill="#0d6f80">本地 python -m http.server 能看到样式</tspan>，只看 file:// 会骗人（相对路径 / CORS 差异）。</text>
    <text x="22" y="210">检查点 2：<tspan fill="#0d6f80">git status 干净、远端分支与 Pages 源目录一致</tspan>，否则页面 404 多半是推错了分支。</text>
    <text x="22" y="236">检查点 3：<tspan fill="#0d6f80">构建约需 1 分钟，缓存还需再刷</tspan>；用 curl 而不是浏览器的历史缓存来判断"到底发布成功没有"。</text>
    <text x="22" y="262">检查点 4：<tspan fill="#0d6f80">状态行出现 HTTP/2 200 才算闭环</tspan> —— 内容对了，协议也要确认。</text>
  </g>
</svg>
