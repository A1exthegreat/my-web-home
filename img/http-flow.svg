<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0L9 4L0 8z" fill="#1a6fb5"/>
    </marker>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0L9 4L0 8z" fill="#14b8c4"/>
    </marker>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#103a63"/><stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="#f7fafd" stroke="#e3e8ef" rx="14"/>
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0a2540">一次访问 my-web-home 的完整链路（实测：HTTP/2 + TLS1.3）</text>

  <!-- 三个节点 -->
  <g>
    <rect x="40" y="130" width="180" height="90" rx="12" fill="url(#box1)"/>
    <text x="130" y="168" text-anchor="middle" font-size="17" fill="#ffffff">浏览器 / curl</text>
    <text x="130" y="194" text-anchor="middle" font-size="13" fill="#9fd6e6">client</text>

    <rect x="350" y="130" width="180" height="90" rx="12" fill="#ffffff" stroke="#c9d8e6"/>
    <text x="440" y="162" text-anchor="middle" font-size="16" fill="#1f2933">DNS + 中间代理</text>
    <text x="440" y="186" text-anchor="middle" font-size="13" fill="#52606d">解析 / TCP / TLS1.3</text>
    <text x="440" y="206" text-anchor="middle" font-size="13" fill="#52606d">ALPN 协商 h2</text>

    <rect x="670" y="130" width="190" height="90" rx="12" fill="url(#box1)"/>
    <text x="765" y="162" text-anchor="middle" font-size="17" fill="#ffffff">GitHub Pages</text>
    <text x="765" y="186" text-anchor="middle" font-size="13" fill="#9fd6e6">server: GitHub.com</text>
    <text x="765" y="206" text-anchor="middle" font-size="13" fill="#9fd6e6">via: Varnish (HTTP/2)</text>
  </g>

  <!-- 请求 / 响应箭头 -->
  <g stroke="#1a6fb5" stroke-width="2.4" marker-end="url(#arr)" fill="none">
    <path d="M225 152 L345 152"/>
    <path d="M535 152 L665 152"/>
  </g>
  <g stroke="#14b8c4" stroke-width="2.4" marker-end="url(#arr2)" fill="none" stroke-dasharray="7 5">
    <path d="M665 198 L545 198"/>
    <path d="M345 198 L235 198"/>
  </g>
  <g font-size="13" fill="#1a6fb5">
    <text x="285" y="140" text-anchor="middle">GET / TLS</text>
    <text x="600" y="140" text-anchor="middle">:method=GET</text>
  </g>
  <g font-size="13" fill="#0d7f8b">
    <text x="600" y="218" text-anchor="middle">200 OK (h2)</text>
    <text x="285" y="218" text-anchor="middle">HTML / CSS / IMG 多路复用</text>
  </g>

  <!-- 底部说明 -->
  <g font-size="13" fill="#52606d">
    <text x="40" y="270">· HTTP/2 用二进制分帧，一条 TCP 连接上并发多个流（本站 HTML/CSS/SVG/PNG 同时下载）</text>
    <text x="40" y="296">· 首部经 HPACK 压缩；响应头带 cache-control: max-age=600，第二次访问直接命中本地缓存</text>
    <text x="40" y="322">· 若用 curl --http1.1 强制降级，仍可成功，说明服务端同时支持 h1.1 与 h2</text>
  </g>
</svg>
