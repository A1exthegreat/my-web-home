<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe4f7"/>
      <stop offset="65%" stop-color="#e8f6fd"/>
      <stop offset="100%" stop-color="#fdf3f6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ece1"/><stop offset="100%" stop-color="#dcd0bd"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3e8"/><stop offset="100%" stop-color="#3f9fc4"/>
    </linearGradient>
  </defs>

  <rect width="860" height="520" fill="url(#sky)"/>
  <circle cx="720" cy="80" r="38" fill="#ffd98a" opacity=".9"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="150" cy="80" rx="52" ry="18"/><ellipse cx="190" cy="72" rx="34" ry="14"/>
    <ellipse cx="480" cy="52" rx="44" ry="15"/><ellipse cx="510" cy="46" rx="26" ry="11"/>
  </g>

  <!-- 主楼（图书馆风格：中轴对称 + 柱廊） -->
  <g>
    <rect x="180" y="220" width="500" height="150" fill="url(#wall)" stroke="#c3b49c"/>
    <rect x="150" y="200" width="560" height="24" fill="#b9a888"/>
    <path d="M360 200l70-58 70 58z" fill="#c9b896" stroke="#b0a082"/>
    <rect x="392" y="150" width="8" height="22" fill="#8f8267"/>
    <circle cx="396" cy="142" r="9" fill="#f4b942" stroke="#c99a26" stroke-width="2"/>
    <!-- 柱廊 -->
    <g fill="#fbf7f0" stroke="#cbbda6">
      <rect x="206" y="236" width="22" height="134" rx="4"/>
      <rect x="256" y="236" width="22" height="134" rx="4"/>
      <rect x="306" y="236" width="22" height="134" rx="4"/>
      <rect x="530" y="236" width="22" height="134" rx="4"/>
      <rect x="580" y="236" width="22" height="134" rx="4"/>
      <rect x="630" y="236" width="22" height="134" rx="4"/>
    </g>
    <!-- 门窗 -->
    <g fill="#2f5f80">
      <rect x="352" y="250" width="40" height="56" rx="6"/>
      <rect x="408" y="250" width="40" height="56" rx="6"/>
      <rect x="352" y="316" width="96" height="54" rx="6" fill="#264c66"/>
    </g>
    <g fill="#2f5f80" opacity=".85">
      <rect x="206" y="256" width="22" height="34" rx="4" opacity=".35"/>
      <rect x="630" y="256" width="22" height="34" rx="4" opacity=".35"/>
    </g>
    <text x="430" y="242" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="19" fill="#6b5c41" letter-spacing="6">图书馆</text>
  </g>

  <!-- 地面 / 湖 -->
  <rect y="370" width="860" height="150" fill="#dff0dd"/>
  <ellipse cx="640" cy="452" rx="210" ry="46" fill="url(#lake)"/>
  <g stroke="#ffffff" stroke-opacity=".6" stroke-width="2">
    <path d="M560 448h60M660 462h70M700 440h50"/>
  </g>
  <path d="M0 372h860" stroke="#c9dcc6" stroke-width="3"/>
  <!-- 步道 -->
  <path d="M380 520l26-150h48l26 150z" fill="#efe6d6" stroke="#dccfb8"/>

  <!-- 樱花树 -->
  <g>
    <rect x="96" y="300" width="14" height="76" rx="6" fill="#7a5a3f"/>
    <circle cx="103" cy="280" r="46" fill="#f9c6d4"/>
    <circle cx="70"  cy="300" r="30" fill="#f6b3c6"/>
    <circle cx="140" cy="300" r="32" fill="#fbd5e0"/>
    <rect x="742" y="304" width="13" height="72" rx="6" fill="#7a5a3f"/>
    <circle cx="748" cy="286" r="42" fill="#f9c6d4"/>
    <circle cx="716" cy="306" r="26" fill="#fbd5e0"/>
    <circle cx="780" cy="306" r="28" fill="#f6b3c6"/>
  </g>
  <!-- 飘落花瓣 -->
  <g fill="#f7b9cb" opacity=".9">
    <ellipse cx="200" cy="250" rx="5" ry="3"/><ellipse cx="250" cy="320" rx="4" ry="3"/>
    <ellipse cx="620" cy="240" rx="5" ry="3"/><ellipse cx="680" cy="330" rx="4" ry="3"/>
    <ellipse cx="420" cy="120" rx="4" ry="3"/><ellipse cx="520" cy="180" rx="5" ry="3"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5b7186" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M250 110q10-9 20 0q10-9 20 0"/>
    <path d="M300 140q8-7 16 0q8-7 16 0"/>
  </g>

  <!-- 人物剪影 -->
  <g fill="#3d5a6c">
    <circle cx="330" cy="404" r="8"/><rect x="324" y="412" width="12" height="30" rx="5"/>
    <circle cx="470" cy="408" r="7"/><rect x="465" y="415" width="11" height="26" rx="5"/>
  </g>
</svg>
