<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="pa" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0L9 4L0 8z" fill="#1a6fb5"/>
    </marker>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6fb5"/><stop offset="100%" stop-color="#14b8c4"/>
    </linearGradient>
  </defs>
  <rect width="920" height="340" rx="14" fill="#f7fafd" stroke="#e3e8ef"/>
  <text x="460" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0a2540">我关心的一条技术链路：从一个以太网帧到一次大模型推理</text>

  <g font-size="14">
    <g>
      <rect x="26"  y="90" width="150" height="76" rx="12" fill="#0a2540"/>
      <text x="101" y="120" text-anchor="middle" fill="#fff">网卡 / 以太网帧</text>
      <text x="101" y="144" text-anchor="middle" fill="#9fd6e6" font-size="12">链路层 · MTU 1500</text>
    </g>
    <g>
      <rect x="206" y="90" width="150" height="76" rx="12" fill="#103a63"/>
      <text x="281" y="120" text-anchor="middle" fill="#fff">内核协议栈</text>
      <text x="281" y="144" text-anchor="middle" fill="#9fd6e6" font-size="12">IP / TCP · xv6 · NexOS</text>
    </g>
    <g>
      <rect x="386" y="90" width="150" height="76" rx="12" fill="url(#p1)"/>
      <text x="461" y="120" text-anchor="middle" fill="#fff">应用层协议</text>
      <text x="461" y="144" text-anchor="middle" fill="#eafcfb" font-size="12">HTTP/2 · DNS · TLS</text>
    </g>
    <g>
      <rect x="566" y="90" width="150" height="76" rx="12" fill="#103a63"/>
      <text x="641" y="120" text-anchor="middle" fill="#fff">Web 服务</text>
      <text x="641" y="144" text-anchor="middle" fill="#9fd6e6" font-size="12">GitHub Pages · Nginx</text>
    </g>
    <g>
      <rect x="746" y="90" width="150" height="76" rx="12" fill="#0a2540"/>
      <text x="821" y="120" text-anchor="middle" fill="#fff">AI 推理服务</text>
      <text x="821" y="144" text-anchor="middle" fill="#9fd6e6" font-size="12">KV Cache 分层管理</text>
    </g>
  </g>
  <g stroke="#1a6fb5" stroke-width="2.4" marker-end="url(#pa)">
    <line x1="176" y1="128" x2="200" y2="128"/>
    <line x1="356" y1="128" x2="380" y2="128"/>
    <line x1="536" y1="128" x2="560" y2="128"/>
    <line x1="716" y1="128" x2="740" y2="128"/>
  </g>
  <text x="460" y="196" text-anchor="middle" font-size="13" fill="#52606d">越往下越接近用户，越往上越接近硬件；我希望自己能在中间两层之间自由穿行</text>

  <g font-size="13.5">
    <rect x="26" y="226" width="278" height="84" rx="12" fill="#ffffff" stroke="#cbe7f5"/>
    <text x="44" y="254" fill="#0d6f80" font-weight="700">问题 1 · 协议开销</text>
    <text x="44" y="280" fill="#3e4c59">HTTP/2 的首部压缩与多路复用，</text>
    <text x="44" y="300" fill="#3e4c59">对小静态站点究竟省下多少 RTT？</text>

    <rect x="321" y="226" width="278" height="84" rx="12" fill="#ffffff" stroke="#cbe7f5"/>
    <text x="339" y="254" fill="#0d6f80" font-weight="700">问题 2 · 缓存与一致性</text>
    <text x="339" y="280" fill="#3e4c59">CDN/浏览器双层缓存的失效策略，</text>
    <text x="339" y="300" fill="#3e4c59">如何既快又能及时看到新版本？</text>

    <rect x="616" y="226" width="278" height="84" rx="12" fill="#ffffff" stroke="#cbe7f5"/>
    <text x="634" y="254" fill="#0d6f80" font-weight="700">问题 3 · 内存墙</text>
    <text x="634" y="280" fill="#3e4c59">推理服务的 KV Cache 与页缓存争抢</text>
    <text x="634" y="300" fill="#3e4c59">内存，COW 与分层卸载能否缓解？</text>
  </g>
</svg>
